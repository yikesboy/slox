---
protocols:
  "Expr":
    computed_properties:
      - name: id
        type: UUID
        access: r
    functions:
      - name: accept
        generic_params: [T, "E: Error"]
        params:
          - name: visitor
            type: "any ExprVisitor<T, E>"
          - name: env
            type: "inout Environment"
        throwing: E
        returns: T
      - name: accept
        generic_params: [T, "E: Error"]
        params:
          - name: visitor
            type: "inout any ResolverExprVisitor<T, E>"
        throwing: E
        returns: T
  "Stmt":
    computed_properties:
      - name: id
        type: UUID
        access: r
    functions:
      - name: accept
        generic_params: ["E: Error"]
        params:
          - name: visitor
            type: "any StmtVisitor<E>"
          - name: env
            type: "inout Environment"
        throwing: E
        returns: ControlFlow
      - name: accept
        generic_params: ["E: Error"]
        params:
          - name: visitor
            type: "inout any ResolverStmtVisitor<E>"
        throwing: E
        returns: ControlFlow
  ExprVisitor:
    generic_params: [ReturnType, ErrorType]
    associated_types:
      - name: ReturnType
      - name: ErrorType
        constraints: [Error]
    functions:
        # Environment-based versions (for Interpreter)
      - name: visit
        params:
          - name: literal
            type: Literal
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: grouping
            type: Grouping
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: binary
            type: Binary
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: unary
            type: Unary
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: variable
            type: Variable
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: assign
            type: Assign
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: logical
            type: Logical
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: call
            type: Call
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: get
            type: Get
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: set
            type: Set
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ReturnType
  ResolverExprVisitor:
    generic_params: [ReturnType, ErrorType]
    associated_types:
      - name: ReturnType
      - name: ErrorType
        constraints: [Error]
    functions:
        # Non-environment versions (for Resolver)
      - name: visit
        params:
          - name: literal
            type: Literal
        throwing: ErrorType
        returns: ReturnType
        
      - name: visit
        params:
          - name: grouping
            type: Grouping
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: binary
            type: Binary
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: unary
            type: Unary
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: variable
            type: Variable
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: assign
            type: Assign
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: logical
            type: Logical
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: call
            type: Call
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: get
            type: Get
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: set
            type: Set
        throwing: ErrorType
        returns: ReturnType
  StmtVisitor:
    generic_params: [ErrorType]
    associated_types:
      - name: ErrorType
        constraints: [Error]
    functions:
      - name: visit
        params:
          - name: expression
            type: Expression
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: print
            type: Print
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: _var
            type: Var
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: block
            type: Block
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: _if
            type: _If
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: _while
            type: _While
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: function
            type: Function
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: _return
            type: Return
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: _class
            type: Class
          - name: env
            type: "inout Environment"
        throwing: ErrorType
        returns: ControlFlow
  ResolverStmtVisitor:
    generic_params: [ErrorType]
    associated_types:
      - name: ErrorType
        constraints: [Error]
    functions:
      # without env
      - name: visit
        params:
          - name: expression
            type: Expression
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: print
            type: Print
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: _var
            type: Var
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: block
            type: Block
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: _if
            type: _If
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: _while
            type: _While
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: function
            type: Function
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: _return
            type: Return
        throwing: ErrorType
        returns: ControlFlow
      - name: visit
        params:
          - name: _class
            type: Class
        throwing: ErrorType
        returns: ControlFlow
structs:
  Binary:
    conforms_to: [Expr]
    fields:
      - name: left
        type: Expr
      - name: _operator
        type: Token
      - name: right
        type: Expr
  Grouping:
    conforms_to: [Expr]
    fields:
      - name: expression
        type: Expr
  Literal:
    conforms_to: [Expr]
    fields:
      - name: value
        type: Object
  Unary:
    conforms_to: [Expr]
    fields:
      - name: _operator
        type: Token
      - name: right
        type: Expr
  Variable:
    conforms_to: [Expr]
    fields:
      - name: name
        type: Token
  Assign:
    conforms_to: [Expr]
    fields:
      - name: name
        type: Token
      - name: value
        type: Expr
  Logical:
    conforms_to: [Expr]
    fields:
      - name: left
        type: Expr
      - name: _operator
        type: Token
      - name: right
        type: Expr
  Call:
    conforms_to: [Expr]
    fields:
      - name: callee
        type: Expr
      - name: paren
        type: Token
      - name: arguments
        type: "[Expr]"
  Get:
    conforms_to: [Expr]
    fields:
      - name: object
        type: Expr
      - name: name
        type: Token
  Set:
    conforms_to: [Expr]
    fields:
      - name: object
        type: Expr
      - name: name
        type: Token
      - name: value
        type: Expr
  Expression:
    conforms_to: [Stmt]
    fields:
      - name: expression
        type: Expr
  Print:
    conforms_to: [Stmt]
    fields:
      - name: expression
        type: Expr
  Var:
    conforms_to: [Stmt]
    fields:
      - name: name
        type: Token
      - name: initializer
        type: Expr?
  Block:
    conforms_to: [Stmt]
    fields:
      - name: statements
        type: "[Stmt]"
  _If:
    conforms_to: [Stmt]
    fields:
      - name: condition
        type: Expr
      - name: thenBranch
        type: Stmt
      - name: elseBranch
        type: Stmt?
  _While:
    conforms_to: [Stmt]
    fields:
      - name: condition
        type: Expr
      - name: body
        type: Stmt
  Function:
    conforms_to: [Stmt]
    fields:
      - name: name
        type: Token
      - name: params
        type: "[Token]"
      - name: body
        type: "[Stmt]"
  Return:
    conforms_to: [Stmt]
    fields:
      - name: keyword
        type: Token
      - name: value
        type: Expr?
  Class:
    conforms_to: [Stmt]
    fields:
      - name: name
        type: Token
      - name: methods
        type: "[Function]"
