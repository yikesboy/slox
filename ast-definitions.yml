protocols:
  Expr:
    functions:
      - name: accept
        generic_params: [T, "E: Error"]
        params:
          - name: visitor
            type: "any ExprVisitor<T, E>"
        throwing: E
        returns: T
  Stmt:
    functions:
      - name: accept
        generic_params: ["E: Error"]
        params:
          - name: visitor
            type: "any StmtVisitor<E>"
        throwing: E
        returns: Void
  ExprVisitor:
    generic_params: [ReturnType, ErrorType]
    associated_types:
      - name: ReturnType
      - name: ErrorType
        constraints: [Error]
    functions:
      - name: visit
        params:
          - name: literal
            type: Literal
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: grouping
            type: Grouping
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: binary
            type: Binary
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: unary
            type: Unary
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: variable
            type: Variable
        throwing: ErrorType
        returns: ReturnType
      - name: visit
        params:
          - name: assign
            type: Assign
        throwing: ErrorType
        returns: ReturnType
  StmtVisitor:
    generic_params: [ErrorType]
    associated_types:
      - name: ErrorType
        constraints: [Error]
    functions:
      - name: visit
        params:
          - name: expression
            type: Expression
        throwing: ErrorType
      - name: visit
        params:
          - name: print
            type: Print
        throwing: ErrorType
      - name: visit
        params:
          - name: _var
            type: Var
        throwing: ErrorType
structs:
  Binary:
    conforms_to: [Expr]
    fields:
      - name: left
        type: Expr
      - name: _operator
        type: Token
      - name: right
        type: Expr
  Grouping:
    conforms_to: [Expr]
    fields:
      - name: expression
        type: Expr
  Literal:
    conforms_to: [Expr]
    fields:
      - name: value
        type: Object
  Unary:
    conforms_to: [Expr]
    fields:
      - name: _operator
        type: Token
      - name: right
        type: Expr
  Variable:
    conforms_to: [Expr]
    fields:
      - name: name
        type: Token
  Assign:
    conforms_to: [Expr]
    fields:
      - name: name
        type: Token
      - name: value
        type: Expr
  Expression:
    conforms_to: [Stmt]
    fields:
      - name: expression
        type: Expr
  Print:
    conforms_to: [Stmt]
    fields:
      - name: expression
        type: Expr
  Var:
    conforms_to: [Stmt]
    fields:
      - name: name
        type: Token
      - name: initializer
        type: Expr?
